<!--
  Client-side UI localization (English / Korean / Japanese).

  Scope: presentation only. This layer never changes app flow, request payloads,
  validation rules, or anything sent to the X Ads API - it only swaps the text a
  user reads. English is the default and is always the fallback for a missing key.

  How it works:
    - Static markup is tagged with data-i18n="key" (and data-i18n-placeholder /
      data-i18n-title / data-i18n-html variants). applyI18n() walks a subtree and
      rewrites those nodes.
    - Imperatively rendered markup (schedules list, media picker, series builder)
      calls window.t('key', 'English fallback') while building its HTML, so a
      re-render always produces the active language.
    - A MutationObserver re-translates any subtree injected after load, so
      innerHTML renders that carry data-i18n attributes localize themselves.
    - The original English is captured into data-i18n-src on first pass, so
      switching back to English restores the exact source text.

  Terminology note: translations follow the wording X Ads and comparable ad /
  scheduling tools use in each locale (e.g. ja ウェブサイトカード・見出し・リンク先URL,
  ko 웹사이트 카드・제목・연결 URL) rather than literal word-for-word translation.
-->

  // ---------------------------------------------------------------------------
  // Engine
  // ---------------------------------------------------------------------------
  function normalizeLang(l) {
    l = String(l == null ? '' : l).toLowerCase().trim();
    if (l === 'kr' || l === 'ko-kr') l = 'ko';
    if (l === 'jp' || l === 'ja-jp') l = 'ja';
    return SUPPORTED.indexOf(l) !== -1 ? l : DEFAULT_LANG;
  }

  var current = DEFAULT_LANG;
  try { current = normalizeLang(window.localStorage.getItem(STORAGE_KEY)); } catch (e) {}

  function getLang() { return current; }

  // t(key, englishFallback) - returns the active language's string, or the
  // English fallback (never an empty/blank label).
  function t(key, fallback) {
    var fb = (fallback == null) ? key : fallback;
    if (current === DEFAULT_LANG) return fb;
    var table = DICT[current];
    if (!table) return fb;
    var v = table[key];
    return (v == null || v === '') ? fb : v;
  }

  // tf(key, englishFallback, vars) - same as t() but substitutes {name} tokens, so
  // each language can place numbers/types wherever its word order requires.
  function tf(key, fallback, vars) {
    var s = t(key, fallback);
    if (!vars) return s;
    return s.replace(/\{(\w+)\}/g, function (m, name) {
      return Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : m;
    });
  }

  // Capture the original English once so switching back to English is lossless.
  function srcOf(el, attr, read) {
    var stash = 'data-i18n-src-' + attr;
    if (!el.hasAttribute(stash)) el.setAttribute(stash, read());
    return el.getAttribute(stash);
  }

  function translateEl(el) {
    var key;

    key = el.getAttribute('data-i18n');
    if (key) {
      el.textContent = t(key, srcOf(el, 'text', function () { return el.textContent; }));
    }

    key = el.getAttribute('data-i18n-html');
    if (key) {
      el.innerHTML = t(key, srcOf(el, 'html', function () { return el.innerHTML; }));
    }

    key = el.getAttribute('data-i18n-placeholder');
    if (key) {
      el.setAttribute('placeholder', t(key, srcOf(el, 'ph', function () { return el.getAttribute('placeholder') || ''; })));
    }

    key = el.getAttribute('data-i18n-title');
    if (key) {
      el.setAttribute('title', t(key, srcOf(el, 'title', function () { return el.getAttribute('title') || ''; })));
    }

    key = el.getAttribute('data-i18n-aria-label');
    if (key) {
      el.setAttribute('aria-label', t(key, srcOf(el, 'aria', function () { return el.getAttribute('aria-label') || ''; })));
    }

    // Some X pages publish real Japanese/Korean versions at their own URLs, so a
    // localized label should point at the localized page rather than the English one.
    key = el.getAttribute('data-i18n-href');
    if (key) {
      el.setAttribute('href', t(key, srcOf(el, 'href', function () { return el.getAttribute('href') || ''; })));
    }
  }

  var SELECTOR = '[data-i18n],[data-i18n-html],[data-i18n-placeholder],[data-i18n-title],[data-i18n-aria-label],[data-i18n-href]';

  function applyI18n(root) {
    root = root || document.body;
    if (!root || root.nodeType !== 1) return;
    try {
      if (root.matches && root.matches(SELECTOR)) translateEl(root);
      var nodes = root.querySelectorAll ? root.querySelectorAll(SELECTOR) : [];
      for (var i = 0; i < nodes.length; i++) translateEl(nodes[i]);
    } catch (e) { /* localization must never break the app */ }
  }

  // Re-translate subtrees injected by the imperative renderers.
  var observer = null;
  function startObserver() {
    if (observer || !window.MutationObserver || !document.body) return;
    observer = new MutationObserver(function (records) {
      for (var i = 0; i < records.length; i++) {
        var added = records[i].addedNodes;
        for (var j = 0; j < added.length; j++) {
          if (added[j].nodeType === 1) applyI18n(added[j]);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  // Areas that are rendered imperatively from cached state. Re-running these on a
  // language switch relabels them without any network call or state change.
  function rerenderDynamic() {
    var calls = [
      window.__rerenderSchedulesForLang,
      window.__rerenderSeriesForLang,
      window.__syncAdsBadgeAndPillsUI
    ];
    for (var i = 0; i < calls.length; i++) {
      try { if (typeof calls[i] === 'function') calls[i](); } catch (e) {}
    }
  }

  function setLang(lang) {
    current = normalizeLang(lang);
    try { window.localStorage.setItem(STORAGE_KEY, current); } catch (e) {}
    try {
      document.documentElement.setAttribute('lang', current === 'en' ? 'en-GB' : current);
    } catch (e) {}
    applyI18n(document.body);
    rerenderDynamic();
    try {
      window.dispatchEvent(new CustomEvent('dmc-lang-changed', { detail: { lang: current } }));
    } catch (e) {}
  }

  function initSelector() {
    var sel = document.getElementById('lang-select');
    if (!sel) return;
    sel.value = current;
    sel.addEventListener('change', function () { setLang(sel.value); });
  }

  window.t = t;
  window.tf = tf;
  window.applyI18n = applyI18n;
  window.setLang = setLang;
  window.getLang = getLang;
  window.I18N_DICT = DICT;

  function boot() {
    initSelector();
    if (current !== DEFAULT_LANG) {
      try { document.documentElement.setAttribute('lang', current); } catch (e) {}
      applyI18n(document.body);
      rerenderDynamic();
    }
    startObserver();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
